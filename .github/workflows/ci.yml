# One automatic entry point: a release push checks and builds once, then publishes those artifacts.
name: CI

on:
  push:
    branches: [main, hoshimi_main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push must not cancel a release that is already checking, building or publishing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Release plan
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        run: python3 scripts/ci.py

  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  build:
    name: Distribution
    needs: [plan, checks]
    uses: ./.github/workflows/build.yml

  release:
    name: Release
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.build.outputs.version }}
    secrets: inherit
