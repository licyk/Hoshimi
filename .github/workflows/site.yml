name: Documentation site

# Builds the site (site/: the home page and the docs) and publishes it to the gh-pages branch, served by
# GitHub Pages at https://licyk.github.io/Hoshimi/. Netlify (netlify.toml) builds the same site at the root
# path as https://hoshimi-dev.netlify.app, which the pages name as canonical. Settings › Pages › Source:
# "Deploy from a branch", gh-pages, / (root). GITEE_RSA_PRIVATE_KEY is a deploy key with write access.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/generate_provider_inventory.py'
      - '.github/workflows/site.yml'
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than cancelling one under way.
concurrency:
  group: site-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Install Dependencies
        run: bun install --frozen-lockfile
        working-directory: site

      - name: Test and Build
        env:
          VITE_BASE_PATH: /Hoshimi/
        run: |
          bun run check
          bun run test
          bun run build
        working-directory: site

      - name: Configure Git
        env:
          DEPLOY_PRI: ${{ secrets.GITEE_RSA_PRIVATE_KEY }}
          GIT_USERNAME: ${{ github.repository_owner }}
          GIT_EMAIL: ${{ github.repository_owner }}@user.github.com
        run: |
          mkdir -p ~/.ssh/
          echo "${DEPLOY_PRI}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global user.name "${GIT_USERNAME}"
          git config --global user.email "${GIT_EMAIL}"

      - name: Commit the Site
        env:
          GIT_URL: 'git@github.com:licyk/Hoshimi.git'
        run: |
          git -C "${{ github.workspace }}/site/.output/public" init
          git -C "${{ github.workspace }}/site/.output/public" remote add origin "${GIT_URL}"
          git -C "${{ github.workspace }}/site/.output/public" add -A
          git -C "${{ github.workspace }}/site/.output/public" commit -m "Site auto generated. Time: $(date +'%Y-%m-%d %H:%M:%S')"

      - name: Push the Site
        run: |
          git -C "${{ github.workspace }}/site/.output/public" push origin HEAD:gh-pages --force
