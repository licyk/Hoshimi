# Called by CI with its checked artifacts; manual runs check and build before publishing.
name: Release

on:
  workflow_call:
    inputs:
      version:
        description: Version of the distributions already checked and built by CI
        type: string
        required: true
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the checked distributions to PyPI (off builds artifacts only)
        type: boolean
        default: false

permissions:
  contents: read

# Serialize releases, including a version push followed by its tag.
concurrency:
  group: hoshimi-pypi-release
  cancel-in-progress: false

env:
  UV_SYSTEM_PYTHON: '1'

jobs:
  checks:
    name: Checks
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/checks.yml

  build:
    name: Distribution
    needs: checks
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish to PyPI
    needs: [checks, build]
    if: >-
      !cancelled() &&
      (github.event_name != 'workflow_dispatch' ||
       (inputs.publish && needs.checks.result == 'success' && needs.build.result == 'success')) &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/hoshimi_main' || github.ref_type == 'tag')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hoshimi
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - run: uv pip install --upgrade twine
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Publish
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then
            echo "::error::Set TWINE_PASSWORD in the pypi environment or repository secrets."
            exit 1
          fi
          python -m twine upload dist/* --skip-existing --non-interactive

  github-release:
    name: GitHub release
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: distributions
          path: dist/
      - name: Attach the checked distributions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
          fi
